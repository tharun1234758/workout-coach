<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sports Biomechanics HUD - AI Fitness Coach</title>
  
  <!-- MediaPipe Pose CDN Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(14, 18, 27, 0.82);
      --card-border: rgba(65, 78, 105, 0.5);
      --accent-cyan: #00e5ff;
      --accent-green: #34d399;
      --accent-amber: #fbbf24;
      --accent-red: #f87171;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: #fff;
    }
    #viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }
    video { display: none; }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* HUD Layout */
    .hud-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      pointer-events: none;
      z-index: 10;
    }
    .interactive { pointer-events: auto; }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    /* Top Navigation & Status */
    .header-bar {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .top-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--accent-cyan);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .live-indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }
    .hud-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .icon-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--card-border);
      color: #cbd5e1;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Mode Pill Switchers */
    .mode-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .mode-pill {
      background: rgba(25, 33, 49, 0.7);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .mode-pill.active {
      background: var(--accent-cyan);
      color: #050b14;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.4);
    }

    /* Feedback Banner */
    .feedback-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      font-size: 13px;
      font-weight: 600;
    }
    .feedback-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan);
      flex-shrink: 0;
    }

    /* Middle Telemetry Grid */
    .telemetry-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 340px;
      margin: auto 0;
    }
    .metric-card {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .metric-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
    }
    .metric-value-huge {
      font-size: 34px;
      font-weight: 900;
      line-height: 1.1;
      color: var(--accent-green);
      font-variant-numeric: tabular-nums;
    }
    .metric-value {
      font-size: 15px;
      font-weight: 800;
      color: #f8fafc;
      font-variant-numeric: tabular-nums;
    }

    /* Bottom Intensity Meter */
    .footer-bar {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(30, 41, 59, 0.7);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--accent-cyan);
      transition: width 0.08s ease-out, background-color 0.2s ease;
    }

    /* Start / Permission Splash */
    #splash-screen {
      position: absolute;
      inset: 0;
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 24px;
      text-align: center;
    }
    .start-btn {
      background: var(--accent-cyan);
      color: #07090e;
      border: none;
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      margin-top: 24px;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
    }

    /* Responsive Adaptation for Laptop / Desktop Displays */
    @media (min-width: 768px) {
      .hud-overlay {
        padding: 20px;
      }
      .telemetry-container {
        grid-template-columns: 1fr;
        max-width: 190px;
        position: absolute;
        left: 20px;
        top: 130px;
      }
      .footer-bar {
        margin-left: 210px;
      }
      .brand-title {
        font-size: 13px;
      }
      .metric-value-huge {
        font-size: 42px;
      }
    }
  </style>
</head>
<body>

  <!-- Start Screen -->
  <div id="splash-screen">
    <div style="margin-bottom: 12px; font-size: 26px; font-weight: 900; color: var(--accent-cyan);">
      AI SPORTS BIOMECHANICS
    </div>
    <p style="font-size: 13px; color: var(--text-muted); max-width: 320px; line-height: 1.5;">
      Real-time kinematic joint tracking, rep cadence analysis, and adaptive form validation running completely in your browser.
    </p>
    <button class="start-btn interactive" id="btn-start">INITIALIZE WORKOUT</button>
  </div>

  <div id="viewport">
    <video id="video-feed" playsinline></video>
    <canvas id="render-canvas"></canvas>

    <div class="hud-overlay">
      <!-- Top Navigation Card -->
      <div class="glass-card header-bar interactive">
        <div class="top-meta-row">
          <div class="brand-title">
            <span class="live-indicator"></span>
            <span>BIOMECHANIC CORE</span>
          </div>
          <div class="hud-controls">
            <span style="font-size: 12px; font-weight: 700; color: var(--accent-cyan);" id="session-time">00:00</span>
            <button class="icon-btn" id="btn-audio" title="Toggle Sound">🔊</button>
            <button class="icon-btn" id="btn-flip" title="Switch Camera">🔄</button>
            <button class="icon-btn" id="btn-reset" title="Reset Reps">↺</button>
          </div>
        </div>

        <!-- Mode Selectors -->
        <div class="mode-pills">
          <button class="mode-pill active" data-mode="SQUATS">Squats</button>
          <button class="mode-pill" data-mode="BICEP_CURLS">Bicep Curls</button>
          <button class="mode-pill" data-mode="SHOULDER_PRESS">Overhead Press</button>
        </div>

        <!-- Dynamic Cue Message -->
        <div class="feedback-banner">
          <div class="feedback-dot" id="cue-dot"></div>
          <span id="cue-text">Stand sideways in frame</span>
        </div>
      </div>

      <!-- Live Telemetry Card Grid -->
      <div class="telemetry-container interactive">
        <div class="glass-card metric-card">
          <span class="metric-label">Rep Count</span>
          <span class="metric-value-huge" id="val-reps">00</span>
        </div>
        <div class="glass-card metric-card">
          <span class="metric-label">Joint Angle</span>
          <span class="metric-value" id="val-angle">-- deg</span>
        </div>
        <div class="glass-card metric-card">
          <span class="metric-label">Est. Calories</span>
          <span class="metric-value" id="val-cal" style="color: var(--accent-amber);">0.0 kcal</span>
        </div>
        <div class="glass-card metric-card">
          <span class="metric-label">Form Accuracy</span>
          <span class="metric-value" id="val-form" style="color: var(--accent-cyan);">100%</span>
        </div>
      </div>

      <!-- Bottom Intensity Progress Card -->
      <div class="glass-card footer-bar interactive">
        <div class="progress-header">
          <span id="target-label">CONTRACTION INTENSITY</span>
          <span id="progress-pct">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progress-bar"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- EXERCISE METRICS & BIOMECHANICAL THRESHOLDS ---
    const DRILLS = {
      SQUATS: {
        name: "Squats",
        left_joints: [23, 25, 27],   // Hip -> Knee -> Ankle
        right_joints: [24, 26, 28],
        min_ang: 115,  // Comfortable parallel depth
        max_ang: 150,  // Upright extension
        invert: true,  // Lower angle = deeper squat
        cal_per_rep: 0.32,
        cues: { down: "Lower your hips", up: "Stand tall", ready: "Squat down with control" }
      },
      BICEP_CURLS: {
        name: "Bicep Curls",
        left_joints: [11, 13, 15],   // Shoulder -> Elbow -> Wrist
        right_joints: [12, 14, 16],
        min_ang: 50,
        max_ang: 148,
        invert: true,
        cal_per_rep: 0.18,
        cues: { down: "Curl upward to shoulder", up: "Lower arm completely", ready: "Start with straight arms" }
      },
      SHOULDER_PRESS: {
        name: "Overhead Press",
        left_joints: [23, 11, 13],   // Hip -> Shoulder -> Elbow
        right_joints: [24, 12, 14],
        min_ang: 75,
        max_ang: 155,
        invert: false, // Higher angle = full overhead lockout
        cal_per_rep: 0.25,
        cues: { down: "Press straight overhead", up: "Lower elbows to chest", ready: "Start at collarbone & press" }
      }
    };

    // State
    let activeMode = "SQUATS";
    let reps = 0;
    let reachedPeak = false;
    let state = "READY";
    let smoothedAngle = null;
    let lastRepTimestamp = 0;
    let soundEnabled = true;
    let currentFacingMode = "user";
    let startTime = null;
    let formScore = 100;

    // DOM Elements
    const video = document.getElementById('video-feed');
    const canvas = document.getElementById('render-canvas');
    const ctx = canvas.getContext('2d');
    const repsEl = document.getElementById('val-reps');
    const angleEl = document.getElementById('val-angle');
    const calEl = document.getElementById('val-cal');
    const formEl = document.getElementById('val-form');
    const cueText = document.getElementById('cue-text');
    const cueDot = document.getElementById('cue-dot');
    const progressBar = document.getElementById('progress-bar');
    const progressPct = document.getElementById('progress-pct');
    const timerEl = document.getElementById('session-time');
    const splash = document.getElementById('splash-screen');

    // Timer
    setInterval(() => {
      if (!startTime) return;
      const s = Math.floor((Date.now() - startTime) / 1000);
      timerEl.textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }, 1000);

    // Audio Oscillator Sound Chime
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function triggerAudioFeedback() {
      if (!soundEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5 note
      osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.12); // A5
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    // Kinematic Joint Angle Math
    function getAngle(a, b, c) {
      const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
      let ang = Math.abs((radians * 180.0) / Math.PI);
      return ang > 180.0 ? 360.0 - ang : ang;
    }

    // Setup MediaPipe
    const pose = new Pose({
      locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`
    });
    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.55,
      minTrackingConfidence: 0.55
    });
    pose.onResults(processFrame);

    function processFrame(res) {
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const w = canvas.width;
      const h = canvas.height;

      ctx.save();
      ctx.clearRect(0, 0, w, h);
      if (currentFacingMode === 'user') {
        ctx.translate(w, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(res.image, 0, 0, w, h);

      const cfg = DRILLS[activeMode];
      let valid = false;

      if (res.poseLandmarks) {
        const lm = res.poseLandmarks;

        // Auto Side Detection: Select Left or Right joints based on visibility
        const leftScore = (lm[cfg.left_joints[0]]?.visibility || 0) + (lm[cfg.left_joints[1]]?.visibility || 0);
        const rightScore = (lm[cfg.right_joints[0]]?.visibility || 0) + (lm[cfg.right_joints[1]]?.visibility || 0);
        const activeJoints = rightScore > leftScore ? cfg.right_joints : cfg.left_joints;

        const p1 = lm[activeJoints[0]];
        const p2 = lm[activeJoints[1]];
        const p3 = lm[activeJoints[2]];

        if (p1 && p2 && p3 && p1.visibility > 0.45 && p2.visibility > 0.45 && p3.visibility > 0.45) {
          valid = true;
          const raw = getAngle(p1, p2, p3);
          smoothedAngle = smoothedAngle === null ? raw : 0.30 * raw + 0.70 * smoothedAngle;

          // Render Biomechanical Skeleton
          ctx.lineWidth = 4;
          ctx.strokeStyle = "#00e5ff";
          ctx.beginPath();
          ctx.moveTo(p1.x * w, p1.y * h);
          ctx.lineTo(p2.x * w, p2.y * h);
          ctx.lineTo(p3.x * w, p3.y * h);
          ctx.stroke();

          [p1, p2, p3].forEach(pt => {
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(pt.x * w, pt.y * h, 7, 0, 2 * Math.PI);
            ctx.fill();
            ctx.strokeStyle = "#00e5ff";
            ctx.stroke();
          });

          // State Machine
          const now = Date.now();
          if (cfg.invert) {
            if (smoothedAngle <= cfg.min_ang) {
              reachedPeak = true;
              state = "CONTRACTED";
              updateFeedback(cfg.cues.up, "#34d399");
            } else if (smoothedAngle >= cfg.max_ang) {
              if (reachedPeak && state === "CONTRACTED") {
                if (now - lastRepTimestamp > 450) {
                  reps++;
                  lastRepTimestamp = now;
                  triggerAudioFeedback();
                }
                reachedPeak = false;
                state = "READY";
                updateFeedback(`Rep #${reps} Counted!`, "#34d399");
              } else {
                state = "READY";
                updateFeedback(cfg.cues.ready, "#00e5ff");
              }
            }
          } else {
            if (smoothedAngle >= cfg.max_ang) {
              reachedPeak = true;
              state = "CONTRACTED";
              updateFeedback(cfg.cues.up, "#34d399");
            } else if (smoothedAngle <= cfg.min_ang) {
              if (reachedPeak && state === "CONTRACTED") {
                if (now - lastRepTimestamp > 450) {
                  reps++;
                  lastRepTimestamp = now;
                  triggerAudioFeedback();
                }
                reachedPeak = false;
                state = "READY";
                updateFeedback(`Rep #${reps} Counted!`, "#34d399");
              } else {
                state = "READY";
                updateFeedback(cfg.cues.ready, "#00e5ff");
              }
            }
          }
        }
      }

      ctx.restore();

      if (!valid) {
        updateFeedback("Position athlete sideways in frame", "#94a3b8");
        smoothedAngle = cfg.invert ? cfg.max_ang : cfg.min_ang;
      }

      // Update HUD Values
      repsEl.textContent = String(reps).padStart(2, '0');
      angleEl.textContent = `${Math.round(smoothedAngle)} deg`;
      calEl.textContent = `${(reps * cfg.cal_per_rep).toFixed(1)} kcal`;

      // Intensity Percentage Fill
      let progress = cfg.invert
        ? (cfg.max_ang - smoothedAngle) / (cfg.max_ang - cfg.min_ang)
        : (smoothedAngle - cfg.min_ang) / (cfg.max_ang - cfg.min_ang);
      const pct = Math.min(Math.max(Math.round(progress * 100), 0), 100);

      progressBar.style.width = `${pct}%`;
      progressPct.textContent = `${pct}%`;
      progressBar.style.background = pct >= 95 ? "var(--accent-green)" : "var(--accent-cyan)";
    }

    function updateFeedback(text, color) {
      cueText.textContent = text;
      cueDot.style.background = color;
      cueDot.style.boxShadow = `0 0 10px ${color}`;
    }

    // Camera Stream
    let cameraInstance = null;
    function initCamera() {
      if (cameraInstance) cameraInstance.stop();
      cameraInstance = new Camera(video, {
        onFrame: async () => { await pose.send({ image: video }); },
        facingMode: currentFacingMode,
        width: 640,
        height: 480
      });
      cameraInstance.start();
    }

    // Control Listeners
    document.getElementById('btn-flip').onclick = () => {
      currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
      initCamera();
    };

    document.getElementById('btn-reset').onclick = () => {
      reps = 0;
      reachedPeak = false;
      state = "READY";
      repsEl.textContent = "00";
      calEl.textContent = "0.0 kcal";
    };

    document.getElementById('btn-audio').onclick = (e) => {
      soundEnabled = !soundEnabled;
      e.target.textContent = soundEnabled ? "🔊" : "🔇";
    };

    document.querySelectorAll('.mode-pill').forEach(btn => {
      btn.onclick = (e) => {
        document.querySelectorAll('.mode-pill').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        activeMode = e.target.getAttribute('data-mode');
        reps = 0;
        reachedPeak = false;
        state = "READY";
        smoothedAngle = null;
        updateFeedback(DRILLS[activeMode].cues.ready, "#00e5ff");
      };
    });

    document.getElementById('btn-start').onclick = () => {
      splash.style.display = 'none';
      startTime = Date.now();
      audioCtx.resume();
      initCamera();
    };
  </script>
</body>
</html>
