<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Biomechanic Coach - Live Motion Hub</title>
  
  <!-- MediaPipe Pose CDN Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #eaf5f7;
      color: #0f2c35;
      position: fixed;
      inset: 0;
    }

    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #eaf5f7;
    }

    /* Video kept alive and visible in memory so browsers do not freeze decoding */
    video#video-feed {
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 4px;
      opacity: 0.01;
      pointer-events: none;
      z-index: 1;
    }

    /* Canvas covers full widescreen on laptops and portrait on phones */
    canvas#render-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      background: #eaf5f7;
      display: block;
      z-index: 2;
    }

    .theme-panel {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(162, 203, 212, 0.55);
      border-radius: 16px;
      padding: 10px 14px;
      box-shadow: 0 6px 24px rgba(17, 78, 74, 0.08);
      pointer-events: auto;
    }

    /* TOP PANEL - Responsive: offsets for phones, centers cleanly on laptops */
    .top-header-panel {
      position: absolute;
      top: 65px; /* Safely cleared below phone notches */
      left: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
    }

    @media (min-width: 768px) {
      .top-header-panel {
        top: 20px !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
        width: 88% !important;
        max-width: 900px !important;
      }
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.8px;
      color: #114e4a;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .status-light {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #13c0ce;
      box-shadow: 0 0 8px #13c0ce;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .action-btn {
      background: #f1f8f9;
      border: 1px solid rgba(162, 203, 212, 0.5);
      color: #114e4a;
      height: 29px;
      padding: 0 11px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .action-btn:active { background: #dcf2f5; }

    /* Exercise Selector Bar matching Reference Graphic */
    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .exercise-pills-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
    }
    .exercise-pills-bar::-webkit-scrollbar { display: none; }

    .ex-pill {
      border: 1.5px solid transparent;
      padding: 6px 13px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .ex-pill[data-mode="SQUATS"] { background: #a7f3d0; color: #065f46; }
    .ex-pill[data-mode="BICEP_CURLS"] { background: #fecdd3; color: #9f1239; }
    .ex-pill[data-mode="SHOULDER_PRESS"] { background: #fed7aa; color: #9a3412; }
    .ex-pill[data-mode="LATERAL_RAISES"] { background: #fef08a; color: #854d0e; }
    .ex-pill[data-mode="LUNGES"] { background: #ccfbf1; color: #115e59; }
    .ex-pill[data-mode="LEG_EXTENSIONS"] { background: #e0f2fe; color: #0369a1; }

    .ex-pill.active {
      box-shadow: 0 0 0 2.5px #114e4a;
      transform: scale(1.05);
    }

    .goal-badge-btn {
      background: #ffffff;
      border: 1.5px solid #fb7185;
      color: #e11d48;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(251, 113, 133, 0.15);
    }

    .cue-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 800;
      color: #114e4a;
    }

    /* LEFT TELEMETRY STACK */
    .telemetry-sidebar {
      position: absolute;
      left: 14px;
      top: 205px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      width: 115px;
      z-index: 100;
    }

    @media (min-width: 768px) {
      .telemetry-sidebar {
        top: 130px !important;
        left: 24px !important;
        width: 130px !important;
      }
    }

    .telemetry-item {
      padding: 8px 11px;
      display: flex;
      flex-direction: column;
      border-left: 3.5px solid #13c0ce;
    }

    .telemetry-label {
      font-size: 8.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #587987;
    }

    .telemetry-huge {
      font-size: 28px;
      font-weight: 900;
      line-height: 1.05;
      color: #114e4a;
      font-variant-numeric: tabular-nums;
    }

    .telemetry-val {
      font-size: 13.5px;
      font-weight: 800;
      color: #0f2c35;
      font-variant-numeric: tabular-nums;
    }

    /* BOTTOM PROGRESS DEPTH */
    .footer-progress-panel {
      position: absolute;
      bottom: 16px;
      left: 14px;
      right: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 100;
    }

    @media (min-width: 768px) {
      .footer-progress-panel {
        left: 50% !important;
        transform: translateX(-50%) !important;
        width: 88% !important;
        max-width: 900px !important;
        bottom: 24px !important;
      }
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 800;
      color: #587987;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #e0eff1;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(162, 203, 212, 0.55);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #13c0ce;
      transition: width 0.08s ease-out;
    }

    /* FULLSCREEN ONBOARDING GUIDE OVERLAY */
    #manual-splash {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 10%, #f4fafb 0%, #e2eff1 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 9999999;
      padding: 30px 16px 20px 16px;
      overflow-y: auto;
      align-items: center;
    }

    .splash-top-banner {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      border-radius: 20px;
      background: #dcfce7;
      border: 1px solid #86efac;
      font-size: 11px;
      font-weight: 800;
      color: #15803d;
      margin-bottom: 6px;
      align-self: center;
    }

    .splash-title {
      font-size: 26px;
      font-weight: 900;
      color: #114e4a;
      text-align: center;
      letter-spacing: -0.5px;
      margin-top: 4px;
    }

    .splash-subtitle {
      font-size: 12px;
      font-weight: 600;
      color: #587987;
      text-align: center;
      margin-bottom: 16px;
    }

    .reference-card-container {
      background: rgba(255, 255, 255, 0.96);
      border: 1.5px solid rgba(162, 203, 212, 0.55);
      border-radius: 20px;
      padding: 16px 14px;
      box-shadow: 0 6px 24px rgba(15, 44, 53, 0.06);
      width: 100%;
      max-width: 440px;
    }

    .card-header-label {
      font-size: 11px;
      font-weight: 800;
      color: #0f2c35;
      text-align: center;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }

    .checklist-2x2-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .ref-tile {
      background: #f8fafc;
      border: 1px solid rgba(148, 185, 198, 0.35);
      border-radius: 12px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .tile-step-indicator {
      font-size: 8.5px;
      font-weight: 800;
      color: #587987;
      text-transform: uppercase;
      margin-bottom: 6px;
      align-self: flex-start;
    }

    .tile-graphic-area {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      width: 100%;
    }

    .tile-headline {
      font-size: 10.5px;
      font-weight: 900;
      color: #114e4a;
      text-transform: uppercase;
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .tile-description {
      font-size: 9.5px;
      font-weight: 500;
      color: #587987;
      line-height: 1.35;
    }

    .mini-pills-preview {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      width: 100%;
    }

    .mini-pill {
      font-size: 8px;
      font-weight: 800;
      padding: 2px 4px;
      border-radius: 6px;
      text-align: center;
    }

    .splash-controls-wrap {
      width: 100%;
      max-width: 440px;
    }

    .btn-launch-feed {
      background: #13c0ce;
      color: #ffffff;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.6px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(19, 192, 206, 0.35);
      width: 100%;
      margin-top: 14px;
      transition: transform 0.1s ease;
    }
    .btn-launch-feed:active { transform: scale(0.98); }

    .splash-footer-notes {
      font-size: 9.5px;
      color: #587987;
      text-align: center;
      margin-top: 8px;
      font-weight: 700;
    }

    /* MODAL WINDOWS */
    #goal-modal, #celebration-card {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #ffffff;
      border: 2px solid #114e4a;
      border-radius: 18px;
      padding: 24px;
      text-align: center;
      display: none;
      z-index: 10000000;
      box-shadow: 0 12px 40px rgba(17, 78, 74, 0.2);
      width: 85%;
      max-width: 320px;
    }

    .modal-input {
      background: #f8fafc;
      border: 2px solid #13c0ce;
      border-radius: 10px;
      padding: 10px;
      font-size: 24px;
      font-weight: 900;
      color: #114e4a;
      text-align: center;
      width: 100%;
      margin: 14px 0;
      outline: none;
    }
  </style>
</head>
<body>

  <!-- FRONT PAGE: FULLSCREEN USER MANUAL -->
  <div id="manual-splash">
    <div style="display: flex; flex-direction: column; width: 100%; align-items: center;">
      <div class="splash-top-banner">⚡ ACTIVE BIOMECHANICS V2.8 // MOTION HUB</div>
      <h1 class="splash-title">BIOMECHANIC COACH</h1>
      <p class="splash-subtitle">Real-Time Joint Tracking & Exercise Analytics</p>

      <div class="reference-card-container">
        <div class="card-header-label">ONBOARDING SYSTEM READINESS CHECKLIST</div>

        <div class="checklist-2x2-grid">
          <!-- Tile 1 -->
          <div class="ref-tile">
            <span class="tile-step-indicator">STEP 01</span>
            <div class="tile-graphic-area">
              <svg width="44" height="44" viewBox="0 0 48 48" fill="none">
                <rect x="4" y="10" width="16" height="11" rx="2" stroke="#0f2c35" stroke-width="1.8" fill="#f8fafc"/>
                <circle x="12" y="15.5" r="1.5" fill="#14b8a6"/>
                <line x1="12" y1="21" x2="8" y2="35" stroke="#0f2c35" stroke-width="1.8" fill="#f8fafc"/>
                <line x1="12" y1="21" x2="16" y2="35" stroke="#0f2c35" stroke-width="1.8" stroke-linecap="round"/>
                <circle cx="34" cy="12" r="3" fill="#fb7185"/>
                <path d="M34 15v8l-4 5v6M34 23l5 4 4 7" stroke="#114e4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="tile-headline">CAMERA FRAMING</div>
            <div class="tile-description">Place phone on a stable surface. Stand sideways for Squats/Lunges.</div>
          </div>

          <!-- Tile 2 -->
          <div class="ref-tile">
            <span class="tile-step-indicator">STEP 02</span>
            <div class="tile-graphic-area">
              <div class="mini-pills-preview">
                <div class="mini-pill" style="background: #a7f3d0; color: #065f46;">Squats</div>
                <div class="mini-pill" style="background: #fecdd3; color: #9f1239;">Curls</div>
                <div class="mini-pill" style="background: #fed7aa; color: #9a3412;">Press</div>
                <div class="mini-pill" style="background: #fef08a; color: #854d0e;">Raises
