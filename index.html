<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Biomechanic Coach - Live Motion Hub</title>
  
  <!-- MediaPipe Pose CDN Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw !important;
      height: 100vh !important;
      overflow: hidden !important;
      background: radial-gradient(circle at 50% 15%, #f4fafb 0%, #d8ecef 100%) !important;
      color: #0f2c35;
      position: fixed;
      inset: 0;
    }

    #camera-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #eaf5f7;
    }

    video { display: none; }

    canvas#render-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      background: #eaf5f7;
      display: block;
    }

    .theme-panel {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(162, 203, 212, 0.55);
      border-radius: 16px;
      padding: 10px 14px;
      box-shadow: 0 6px 24px rgba(17, 78, 74, 0.08);
      pointer-events: auto;
    }

    .top-header-panel {
      position: absolute;
      top: 55px;
      left: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
    }

    @media (min-width: 768px) {
      .top-header-panel {
        top: 20px !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
        width: 88% !important;
        max-width: 900px !important;
      }
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.8px;
      color: #114e4a;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .status-light {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #13c0ce;
      box-shadow: 0 0 8px #13c0ce;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .action-btn {
      background: #f1f8f9;
      border: 1px solid rgba(162, 203, 212, 0.5);
      color: #114e4a;
      height: 29px;
      padding: 0 11px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .action-btn:active { background: #dcf2f5; }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .exercise-pills-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
    }
    .exercise-pills-bar::-webkit-scrollbar { display: none; }

    .ex-pill {
      border: 1.5px solid transparent;
      padding: 6px 13px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .ex-pill[data-mode="SQUATS"] { background: #a7f3d0; color: #065f46; }
    .ex-pill[data-mode="BICEP_CURLS"] { background: #fecdd3; color: #9f1239; }
    .ex-pill[data-mode="SHOULDER_PRESS"] { background: #fed7aa; color: #9a3412; }
    .ex-pill[data-mode="LATERAL_RAISES"] { background: #fef08a; color: #854d0e; }
    .ex-pill[data-mode="LUNGES"] { background: #ccfbf1; color: #115e59; }
    .ex-pill[data-mode="LEG_EXTENSIONS"] { background: #e0f2fe; color: #0369a1; }

    .ex-pill.active {
      box-shadow: 0 0 0 2.5px #114e4a;
      transform: scale(1.05);
    }

    .goal-badge-btn {
      background: #ffffff;
      border: 1.5px solid #fb7185;
      color: #e11d48;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(251, 113, 133, 0.15);
    }

    .cue-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px
