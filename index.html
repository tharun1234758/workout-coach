<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Biomechanic Coach - Live Motion Hub</title>
  
  <!-- MediaPipe Pose CDN Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw !important;
      height: 100vh !important;
      overflow: hidden !important;
      background: radial-gradient(circle at 50% 15%, #f4fafb 0%, #d8ecef 100%) !important;
      color: #0f2c35;
      position: fixed;
      inset: 0;
    }

    #camera-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #eaf5f7;
    }

    video { display: none; }

    canvas#render-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      background: #eaf5f7;
      display: block;
    }

    .theme-panel {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(162, 203, 212, 0.55);
      border-radius: 16px;
      padding: 10px 14px;
      box-shadow: 0 6px 24px rgba(17, 78, 74, 0.08);
      pointer-events: auto;
    }

    .top-header-panel {
      position: absolute;
      top: 55px;
      left: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
    }

    @media (min-width: 768px) {
      .top-header-panel {
        top: 20px !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
        width: 88% !important;
        max-width: 900px !important;
      }
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.8px;
      color: #114e4a;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .status-light {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #13c0ce;
      box-shadow: 0 0 8px #13c0ce;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
